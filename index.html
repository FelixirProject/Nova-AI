<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI — Chat</title>
  <style>
    :root { color-scheme: dark; --bg:#090d18; --panel:#10182a; --line:#25324a; --blue:#5797ff; --muted:#91a0b8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -20%,#1a3157 0%,var(--bg) 55%); color:#eef4ff; font-family:Inter,system-ui,Arial,sans-serif; display:flex; justify-content:center; }
    .app { width:min(900px,100%); min-height:100vh; display:flex; flex-direction:column; padding:22px 18px 18px; }
    header { display:flex; align-items:center; gap:12px; padding:8px 4px 18px; border-bottom:1px solid var(--line); }
    .logo { width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#70b5ff,#6458ee);font-weight:900;color:white;box-shadow:0 8px 30px #427de755; }
    h1 { margin:0;font-size:19px;letter-spacing:1.8px; } .sub { color:var(--muted);font-size:12px;margin-top:3px; }
    .status { margin-left:auto;color:#7de3b0;font-size:12px;display:flex;align-items:center;gap:7px; } .dot { width:7px;height:7px;border-radius:50%;background:#49d995;box-shadow:0 0 12px #49d995; }
    #chat { flex:1; overflow-y:auto; padding:28px 4px 18px; display:flex; flex-direction:column; gap:18px; }
    .welcome { margin:auto; text-align:center; max-width:520px; padding:30px 10px; }
    .orb { width:76px;height:76px;border-radius:26px;margin:0 auto 20px;display:grid;place-items:center;font-size:32px;background:linear-gradient(145deg,#1c4e82,#433b9b);box-shadow:0 0 55px #438aff33; }
    .welcome h2 { margin:0 0 10px;font-size:27px; } .welcome p { color:var(--muted);line-height:1.6;margin:0; }
    .msg { display:flex; gap:11px; max-width:86%; align-items:flex-start; } .msg.user { align-self:flex-end; flex-direction:row-reverse; }
    .avatar { flex:0 0 31px;width:31px;height:31px;border-radius:11px;display:grid;place-items:center;background:#1b2b46;color:#9dc5ff;font-size:12px;font-weight:800; }
    .user .avatar { background:#304b80;color:white; }
    .bubble { padding:12px 15px;border:1px solid var(--line);border-radius:5px 16px 16px 16px;background:#111b2e;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere; }
    .user .bubble { background:#1b3762;border-color:#31558a;border-radius:16px 5px 16px 16px; }
    .typing { color:var(--muted);font-size:13px;padding:0 4px 12px; }
    .composer-wrap { border:1px solid #2b3b57;background:#10182a;border-radius:19px;padding:10px;box-shadow:0 15px 50px #0005; }
    .composer { display:flex;align-items:flex-end;gap:9px; }
    textarea { flex:1;resize:none;max-height:150px;min-height:45px;border:0;outline:0;background:transparent;color:#eef4ff;font:inherit;padding:12px 10px; }
    textarea::placeholder { color:#75849d; }
    button { border:0;cursor:pointer;color:white; }
    #send { width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#5aa8ff,#635be9);font-size:20px; }
    #send:disabled { opacity:.45;cursor:default; }
    .hint { color:#73829b;text-align:center;font-size:11px;margin-top:10px; }
    .error { color:#ffaaa9; }
    @media(max-width:600px) { .app{padding:14px 12px;} .msg{max-width:96%;} .welcome h2{font-size:23px;} }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">N</div>
    <div><h1>NOVA AI</h1><div class="sub">Your AI chat assistant</div></div>
    <div class="status"><span class="dot"></span> ONLINE</div>
  </header>
  <main id="chat">
    <section class="welcome" id="welcome">
      <div class="orb">✦</div>
      <h2>Ada yang bisa kubantu?</h2>
      <p>Mulai percakapan dengan NOVA. Tanyakan apa saja, minta penjelasan, atau diskusikan ide yang sedang kamu pikirkan.</p>
    </section>
  </main>
  <div id="typing" class="typing" hidden>NOVA sedang berpikir...</div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="Ketik pesan untuk NOVA..." aria-label="Pesan"></textarea>
      <button id="send" title="Kirim pesan" aria-label="Kirim">➤</button>
    </div>
  </div>
  <div class="hint">NOVA dapat membuat kesalahan. Periksa kembali informasi penting.</div>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('prompt');
  const send = document.getElementById('send');
  const typing = document.getElementById('typing');
  const history = [];

  function addMessage(role, text) {
    document.getElementById('welcome')?.remove();
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'K' : 'N';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.append(avatar, bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = '';
    input.style.height = '45px';
    history.push({role:'user', content:text});
    addMessage('user', text);
    send.disabled = true;
    typing.hidden = false;
    chat.scrollTop = chat.scrollHeight;
    try {
      const response = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:history})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Permintaan gagal.');
      history.push({role:'assistant', content:data.reply});
      addMessage('assistant', data.reply);
    } catch (err) {
      addMessage('assistant', 'Maaf, terjadi kesalahan: ' + err.message);
    } finally {
      typing.hidden = true;
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', () => {
    input.style.height = '45px';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
  });
</script>
</body>
</html>
